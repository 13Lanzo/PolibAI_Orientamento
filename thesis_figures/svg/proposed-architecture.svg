<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Architettura proposta</title><desc id="desc">Il router usa servizi deterministici oppure recupera pochi frammenti rilevanti prima di chiamare Gemini.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6368"/></marker>
</defs>
<style>text{font-family:"Latin Modern Sans","TeX Gyre Heros",Arial,sans-serif} .axis{stroke:#202124;stroke-width:2} .arrow{stroke:#5F6368;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<text x="600" y="45" text-anchor="middle" font-size="29" font-weight="500" fill="#202124">Architettura proposta per l’esercizio multiutente</text><rect x="35" y="270" width="165" height="95" fill="#DCEEF8" stroke="#202124" stroke-width="2" rx="8"/><text x="117.5" y="310.5" text-anchor="middle" font-size="21" font-weight="500" fill="#202124">Angular SPA</text><text x="117.5" y="341.5" text-anchor="middle" font-size="16" font-weight="400" fill="#5F6368">streaming</text><rect x="250" y="270" width="190" height="95" fill="#DDF3EB" stroke="#202124" stroke-width="2" rx="8"/><text x="345" y="310.5" text-anchor="middle" font-size="21" font-weight="500" fill="#202124">API gateway</text><text x="345" y="341.5" text-anchor="middle" font-size="16" font-weight="400" fill="#5F6368">auth + rate limit</text><rect x="500" y="270" width="190" height="95" fill="#DDF3EB" stroke="#202124" stroke-width="2" rx="8"/><text x="595" y="310.5" text-anchor="middle" font-size="21" font-weight="500" fill="#202124">Intent router</text><text x="595" y="341.5" text-anchor="middle" font-size="16" font-weight="400" fill="#5F6368">instradamento</text><rect x="765" y="85" width="205" height="95" fill="#DCEEF8" stroke="#202124" stroke-width="2" rx="8"/><text x="867.5" y="125.5" text-anchor="middle" font-size="21" font-weight="500" fill="#202124">Servizi locali</text><text x="867.5" y="156.5" text-anchor="middle" font-size="16" font-weight="400" fill="#5F6368">mappe / KPI</text><rect x="765" y="255" width="205" height="95" fill="#DDF3EB" stroke="#202124" stroke-width="2" rx="8"/><text x="867.5" y="295.5" text-anchor="middle" font-size="21" font-weight="500" fill="#202124">File Search</text><text x="867.5" y="326.5" text-anchor="middle" font-size="16" font-weight="400" fill="#5F6368">top-k documenti</text><rect x="765" y="430" width="205" height="95" fill="#DDF3EB" stroke="#202124" stroke-width="2" rx="8"/><text x="867.5" y="470.5" text-anchor="middle" font-size="21" font-weight="500" fill="#202124">Session store</text><text x="867.5" y="501.5" text-anchor="middle" font-size="16" font-weight="400" fill="#5F6368">stato per utente</text><rect x="1030" y="255" width="140" height="95" fill="#DCEEF8" stroke="#202124" stroke-width="2" rx="8"/><text x="1100" y="295.5" text-anchor="middle" font-size="21" font-weight="500" fill="#202124">Gemini</text><text x="1100" y="326.5" text-anchor="middle" font-size="16" font-weight="400" fill="#5F6368">prompt ridotto</text><line x1="200" y1="317" x2="250" y2="317" stroke="#5F6368" stroke-width="3" marker-end="url(#arrow)"/><line x1="440" y1="317" x2="500" y2="317" stroke="#5F6368" stroke-width="3" marker-end="url(#arrow)"/><line x1="690" y1="300" x2="765" y2="135" stroke="#5F6368" stroke-width="3" marker-end="url(#arrow)"/><line x1="690" y1="317" x2="765" y2="302" stroke="#5F6368" stroke-width="3" marker-end="url(#arrow)"/><line x1="690" y1="335" x2="765" y2="477" stroke="#5F6368" stroke-width="3" marker-end="url(#arrow)"/><line x1="970" y1="302" x2="1030" y2="302" stroke="#009E73" stroke-width="3" marker-end="url(#arrow)"/><line x1="970" y1="477" x2="1085" y2="350" stroke="#009E73" stroke-width="3" marker-end="url(#arrow)"/><path d="M1100 350 C1100 605 355 605 355 365" fill="none" stroke="#009E73" stroke-width="3" marker-end="url(#arrow)"/><rect x="500" y="520" width="190" height="70" fill="#DCEEF8" stroke="#202124" stroke-width="2" rx="8"/><text x="595" y="548" text-anchor="middle" font-size="21" font-weight="500" fill="#202124">Telemetry</text><text x="595" y="579" text-anchor="middle" font-size="16" font-weight="400" fill="#5F6368">latenza + token + errori</text><line x1="595" y1="365" x2="595" y2="520" stroke="#5F6368" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="650" text-anchor="middle" font-size="20" font-weight="400" fill="#5F6368" font-style="italic">Retrieval selettivo, isolamento delle sessioni e controllo del carico riducono latenza e rischio di saturazione.</text>
</svg>