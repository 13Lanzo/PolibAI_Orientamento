<div class="chatbot-container">
  <!-- Chat Window -->
  <div class="chat-window" [class.open]="isOpen()">
    <div class="chat-header">
      <div class="header-info">
        <div class="avatar">
          <!-- Placeholder logo Poliba -->
          <img src="assets/images/logo-poliba.png" alt="Poliba Logo"
            class="w-10 h-10 rounded-full object-cover bg-white">
        </div>
        <div class="title-area">
          <h3>Poliba Assistant</h3>
          <span class="status">Online</span>
        </div>
      </div>
      <button class="close-btn" (click)="toggleChat()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="chat-messages" #scrollContainer>
      <!-- Loop dei messaggi -->
      <div *ngFor="let msg of messages()" class="message" [class.user]="msg.sender === 'user'"
        [class.bot]="msg.sender === 'bot'">

        <!-- CASO 1: MESSAGGIO DI TESTO NORMALE -->
        <div *ngIf="!msg.type || msg.type === 'text'" class="message-content">
          {{ msg.text }}
        </div>

        <!-- CASO 2: OPZIONI (BOTTONI) -->
        <!-- Questo appare quando il bot chiede "Dove ti trovi?" -->
        <div *ngIf="msg.type === 'options'" class="message-content options-wrapper">
          <p>{{ msg.text }}</p>
          <div class="buttons-container">
            <button *ngFor="let opt of msg.options" (click)="sendOption(opt.value, opt.label)" class="option-btn">
              {{ opt.label }}
            </button>
          </div>
        </div>

        <!-- CASO 3: MAPPA (IMMAGINE) -->
        <!-- Questo appare quando il bot ti dà il percorso -->
        <div *ngIf="msg.type === 'map'" class="message-content map-wrapper">
          <div class="map-header">
            <strong>📍 {{ msg.mapTitle }}</strong>
          </div>
          <div class="map-image-container" (click)="openMap(msg.mapUrl)">
            <img [src]="msg.mapUrl" alt="Mappa Percorso" title="Clicca per ingrandire">
            <div class="overlay">🔍 Ingrandisci</div>
          </div>
          <p class="map-desc">{{ msg.text }}</p>
        </div>

        <span class="timestamp">{{ msg.timestamp | date:'shortTime' }}</span>
      </div>

      <!-- Loading Indicator -->
      <div *ngIf="isLoading()" class="message bot">
        <div class="message-content typing-indicator">
          <span>.</span><span>.</span><span>.</span>
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <input type="text" [ngModel]="currentInput()" (ngModelChange)="currentInput.set($event)"
        (keyup.enter)="sendMessage()" placeholder="Chiedi qualcosa...">
      <button class="send-btn" (click)="sendMessage()" [disabled]="!currentInput().trim()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <!-- Floating Toggle Button -->
  <button class="chat-toggle-btn" (click)="toggleChat()" [class.hidden]="isOpen()">
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
  </button>
</div>
